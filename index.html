<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Girly Calculator ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-wrapper">

        <div class="calculator">

    <!-- 🐰 Decorações kawaii -->

    <!-- Display -->
    <div class="display-area">

        <div class="expression" id="expression">
            0
        </div>

        <div class="result" id="result">
            0
        </div>

    </div>


    <!-- Botões -->
    <div class="buttons">

        <button class="btn btn-utility" data-action="clear">AC</button>
        <button class="btn btn-utility" data-action="delete">DEL</button>
        <button class="btn btn-utility" data-value="%">%</button>
        <button class="btn btn-operator" data-value="/">÷</button>

        <button class="btn btn-kawaii" data-value="7">7
            <img src="assets/bunny.png" class="kawaii-decoration" alt="Coelhinho">
        </button>
        <button class="btn btn-kawaii" data-value="8">8
            <img src="assets/elephant.png" class="kawaii-decoration" alt="Elephant">
        </button>
        <button class="btn btn-kawaii" data-value="9">9
            <img src="assets/lion.png" class="kawaii-decoration" alt="Leao">
        </button>
        <button class="btn btn-operator" data-value="*">×</button>

        <button class="btn btn-kawaii" data-value="4">4
            <img src="assets/piupiu.png" class="kawaii-decoration" alt="Piu-piu">
        </button>
        <button class="btn btn-kawaii" data-value="5">5
            <img src="assets/porquinho.png" class="kawaii-decoration" alt="Porco">
        </button>
        <button class="btn btn-kawaii" data-value="6">6
            <img src="assets/dolphin.png" class="kawaii-decoration" alt="Golfinho">
        </button>
        <button class="btn btn-operator" data-value="-">−</button>

        <button class="btn btn-kawaii" data-value="1">1
            <img src="assets/gatinho.png" class="kawaii-decoration" alt="Gatinho">
        </button>
        <button class="btn btn-kawaii" data-value="2">2
            <img src="assets/patinho.png" class="kawaii-decoration" alt="Pato">
        </button>
        <button class="btn btn-kawaii" data-value="3">3
            <img src="assets/cow.png" class="kawaii-decoration" alt="Vaquinha">
        </button>
        <button class="btn btn-operator" data-value="+">+</button>

        <button class="btn btn-wide btn-kawaii" data-value="0">0
            <img src="assets/urso%20roxo.png" class="kawaii-decoration" alt="Urso roxo">
        </button>
        <button class="btn" data-value=".">.</button>
        <button class="btn btn-equals" data-action="calculate">=</button>

    </div>

</div>
 </div> <!-- Fecha calculator-wrapper -->

    <script src="script.js"></script>

</body>
</html>
